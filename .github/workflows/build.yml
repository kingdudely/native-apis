name: Build and Publish

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash --noprofile --norc -euo pipefail {0}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            artifact: darwin-arm64
          - os: windows-latest
            artifact: win32-x64
          - os: ubuntu-latest
            artifact: linux-x64

    runs-on: ${{ matrix.os }}
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install Linux X11 headers
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libx11-dev libxrandr-dev

      - run: npm install

      - run: npm run build

      - run: test -f prebuilds/${{ matrix.artifact }}/node.napi.node

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: prebuilds/${{ matrix.artifact }}

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'

      - uses: actions/download-artifact@v4
        with:
          path: prebuilds
          merge-multiple: false

      - name: Show downloaded structure
        run: find prebuilds -type f

      - run: npm publish --provenance --access public